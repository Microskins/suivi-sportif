map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Fichiers hashes de Vite (/assets/): gardes un an. Tout le reste, dont
# index.html, est revalide a chaque visite: apres un deploiement, le
# navigateur ne reutilise jamais une page qui cite des scripts effaces.
map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  server_name suivi-sportif.fr www.suivi-sportif.fr;

  root /usr/share/nginx/html;
  index index.html;
  # Derriere le Nginx de l'hote (HTTPS): une redirection garde le schema et
  # l'hote du navigateur au lieu de renvoyer vers http://.
  absolute_redirect off;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://s3.amazonaws.com https://server.arcgisonline.com https://photospicker.googleapis.com https://accounts.google.com; img-src 'self' data: blob:; worker-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://www.google.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # Au niveau du serveur, pas dans les location: un add_header dans une
  # location effacerait la CSP et les autres en-tetes ci-dessus.
  add_header Cache-Control $cache_control always;

  location /exercices-assets/ {
    try_files $uri =404;
  }

  # Regles de confidentialite en HTML statique: le robot de Google (ecran de
  # consentement OAuth) lit le HTML brut, sans executer le JavaScript.
  # Le fichier vit hors d'un dossier voyage/: un vrai dossier de ce nom
  # captait la route /voyage de l'application (403 au lieu de index.html).
  location = /voyage/confidentialite {
    try_files /legal/voyage-confidentialite.html =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}


server {
  listen 80;
  server_name ha-come.fr www.ha-come.fr;

  location / {
    proxy_pass http://192.168.1.7:8123;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
