map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name suivi-sportif.fr www.suivi-sportif.fr;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name suivi-sportif.fr www.suivi-sportif.fr;

  ssl_certificate /etc/letsencrypt/live/suivi-sportif.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/suivi-sportif.fr/privkey.pem;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://s3.amazonaws.com https://server.arcgisonline.com; img-src 'self' data: blob:; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Envois de l'admin Voyage (GPX 10 Mo, photos 15 Mo max cote API): la
  # limite Nginx par defaut (1 Mo) les bloquerait. Le reste de /api/ garde 1 Mo.
  location /api/voyages/admin/ {
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:3001/api/voyages/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://127.0.0.1:3001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /mcp {
    proxy_pass http://127.0.0.1:3033/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-MCP-Auth-Token $http_x_mcp_auth_token;
    proxy_set_header MCP-Session-Id $http_mcp_session_id;
    proxy_set_header Last-Event-ID $http_last_event_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:5173;
    # Le conteneur client pose les memes en-tetes de securite: les masquer
    # evite de les envoyer en double (deux CSP s'appliquent toutes les deux,
    # la plus stricte gagne). Les add_header du server ci-dessus font foi.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name ha-come.fr www.ha-come.fr;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name ha-come.fr www.ha-come.fr;

  ssl_certificate /etc/letsencrypt/live/ha-come.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ha-come.fr/privkey.pem;

  location / {
    proxy_pass http://192.168.1.7:8123;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}